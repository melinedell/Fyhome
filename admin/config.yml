            name: "cookies"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Überschrift", name: "title", widget: "string"}
              - {label: "Absatztext", name: "body", widget: "text"}
  - name: "immobilien"
    label: "Immobilien"
    files:
      - label: "Immobilienübersicht"
        name: "immobilienliste"
        file: "content/properties.json"
        format: "json"
        fields:
          - label: "Immobilien"
            name: "items"
            widget: "list"
            hint: "Vor Status available: Titel und Beschreibung in DE, ES, EN, FR, NL und RU ausfüllen. Fehlende Sprachen zeigen sonst einen Hinweis in der gewählten Sprache."
            summary: "{{fields.title}} · {{fields.city}}"
            fields:
              - {label: "Referenznummer", name: "id", widget: "string"}
              - {label: "Interner Standardtitel (Admin)", name: "title", widget: "string"}
              - {label: "Titel Deutsch", name: "title_de", widget: "string", required: false}
              - {label: "Título Español", name: "title_es", widget: "string", required: false}
              - {label: "Title English", name: "title_en", widget: "string", required: false}
              - {label: "Titre Français", name: "title_fr", widget: "string", required: false}
              - {label: "Titel Nederlands", name: "title_nl", widget: "string", required: false}
              - {label: "Заголовок Русский", name: "title_ru", widget: "string", required: false}
              - {label: "Ort", name: "city", widget: "string"}
              - {label: "Region", name: "region", widget: "select", options: ["Oliva und Umgebung", "Dénia und Umgebung", "Jávea bis Altea"], required: false}
              - {label: "Immobilienart", name: "type", widget: "select", options: [{label: "Haus / Villa", value: "villa"}, {label: "Einfamilienhaus / Landhaus", value: "house"}, {label: "Wohnung / Apartment / Penthouse", value: "apartment"}, {label: "Reihenhaus / Doppelhaus", value: "townhouse"}, {label: "Neubauprojekt mit verschiedenen Wohnungstypen", value: "newbuild"}, {label: "Ladenlokal / Restaurant / Einzelhandel", value: "retail"}, {label: "Büro / Praxis", value: "office"}, {label: "Sonstige Gewerbeimmobilie", value: "commercial"}, {label: "Lagerhalle / Industrie", value: "warehouse"}, {label: "Grundstück / Bauland", value: "land"}]}
              - {label: "Neubau (zusätzlich zur Immobilienart)", name: "new_build", widget: "boolean", required: false, default: false}
              - {label: "Preis (€)", name: "price", widget: "number", value_type: "int", min: 0}
              - {label: "Schlafzimmer", name: "beds", widget: "number", value_type: "int", min: 0, required: false}
              - {label: "Badezimmer", name: "baths", widget: "number", value_type: "int", min: 0, required: false}
              - {label: "Fläche (m²)", name: "area", widget: "number", value_type: "int", min: 0}
              - {label: "Grundstücksfläche (m²)", name: "plot_area", widget: "number", value_type: "int", min: 0, required: false}
              - {label: "Als Topangebot zeigen", name: "featured", widget: "boolean", default: false, required: false}
              - {label: "Status", name: "status", widget: "select", options: ["available", "reserved", "sold", "hidden"]}
              - {label: "Hauptbild", name: "img", widget: "image"}
              - {label: "Weitere Bilder", name: "gallery", widget: "list", field: {label: "Bild", name: "image", widget: "image"}, required: false}
              - {label: "Beschreibung Spanisch", name: "description_es", widget: "text", required: false}
              - {label: "Beschreibung Deutsch", name: "description_de", widget: "text", required: false}
              - {label: "Beschreibung Englisch", name: "description_en", widget: "text", required: false}
              - {label: "Beschreibung Französisch", name: "description_fr", widget: "text", required: false}
              - {label: "Beschreibung Niederländisch", name: "description_nl", widget: "text", required: false}
              - {label: "Beschreibung Russisch", name: "description_ru", widget: "text", required: false}

  - name: "website-texte"
    label: "Website-Texte"
    files:
      - label: "Design, Bilder und Startseitenbereiche"
        name: "gestaltung"
        file: "content/site-settings.json"
        format: "json"
        fields:
          - {label: "Design: Grundfarbe", name: "themeColor", widget: "select", options: [{label: "Dunkelgrün (FYHOM)", value: "forest"}, {label: "Anthrazit", value: "charcoal"}, {label: "Tiefes Marineblau", value: "navy"}], default: "forest"}
          - {label: "Design: Akzentfarbe", name: "accentColor", widget: "select", options: [{label: "Champagnergold", value: "champagne"}, {label: "Sandbeige", value: "sand"}, {label: "Kupfer", value: "copper"}], default: "champagne"}
          - {label: "Startseite: Ausrichtung des Titels", name: "heroAlignment", widget: "select", options: [{label: "Links", value: "left"}, {label: "Mittig", value: "center"}], default: "left"}
          - {label: "Startseite: Service anzeigen", name: "showHomeServices", widget: "boolean", default: true}
          - {label: "Startseite: Warum Costa Blanca anzeigen", name: "showHomeWhy", widget: "boolean", default: true}
          - {label: "Startseite: Immobilienbewertung anzeigen", name: "showHomeValuation", widget: "boolean", default: true}
          - {label: "Startseite: Großes Titelbild", name: "heroImage", widget: "image", required: false}
          - {label: "Startseite: Bild Über uns", name: "aboutImage", widget: "image", required: false}
          - {label: "Startseite: Bild Bewertung", name: "valuationImage", widget: "image", required: false}
      - label: "Alle Website-Texte in 6 Sprachen"
        name: "alle_texte"
        file: "content/site-texts.json"
        format: "json"
        fields:
          - label: "Website-Texte"
            name: "items"
            widget: "list"
            collapsed: true
            minimize_collapsed: true
            allow_add: false
            summary: "{{fields.section}} · {{fields.label}}"
            fields:
              - {label: "Technischer Schlüssel", name: "key", widget: "hidden"}
              - {label: "Bereich", name: "section", widget: "hidden"}
              - {label: "Bezeichnung", name: "label", widget: "hidden"}
              - {label: "Deutsch", name: "de", widget: "text"}
              - {label: "Español", name: "es", widget: "text"}
              - {label: "English", name: "en", widget: "text"}
              - {label: "Français", name: "fr", widget: "text"}
              - {label: "Nederlands", name: "nl", widget: "text"}
              - {label: "Русский", name: "ru", widget: "text"}

  - name: "team"
    label: "Teammitglieder"
    files:
      - label: "Team verwalten"
        name: "team-list"
        file: "content/team.json"
        format: "json"
        fields:
          - label: "Mitarbeiter"
            name: "items"
            widget: "list"
            required: false
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Position Deutsch", name: "role_de", widget: "string", required: false}
              - {label: "Position Spanisch", name: "role_es", widget: "string", required: false}
              - {label: "Position Englisch", name: "role_en", widget: "string", required: false}
              - {label: "Position Französisch", name: "role_fr", widget: "string", required: false}
              - {label: "Position Niederländisch", name: "role_nl", widget: "string", required: false}
              - {label: "Position Russisch", name: "role_ru", widget: "string", required: false}
              - {label: "Position (bisheriges Feld, nur als Ersatz)", name: "role", widget: "hidden", required: false}
              - {label: "Foto", name: "photo", widget: "image", required: false}
              - {label: "Biografie (Deutsch)", name: "bio_de", widget: "text", required: false}
              - {label: "Biografie (Spanisch)", name: "bio_es", widget: "text", required: false}
              - {label: "Biografie (Englisch)", name: "bio_en", widget: "text", required: false}
              - {label: "Biografie (Französisch)", name: "bio_fr", widget: "text", required: false}
              - {label: "Biografie (Niederländisch)", name: "bio_nl", widget: "text", required: false}
              - {label: "Biografie (Russisch)", name: "bio_ru", widget: "text", required: false}
              - {label: "Auf Website anzeigen", name: "visible", widget: "boolean", default: true}
  - name: "leistungen"
    label: "Zusätzliche Leistungen & Ideen"
    files:
      - label: "Leistungen verwalten"
        name: "service-list"
        file: "content/additional-services.json"
        format: "json"
        fields:
          - label: "Weitere Leistungen"
            name: "items"
            widget: "list"
            required: false
            fields:
              - {label: "Titel Deutsch", name: "title_de", widget: "string"}
              - {label: "Text Deutsch", name: "text_de", widget: "text", required: false}
              - {label: "Titel Spanisch", name: "title_es", widget: "string", required: false}
              - {label: "Text Spanisch", name: "text_es", widget: "text", required: false}
              - {label: "Titel Englisch", name: "title_en", widget: "string", required: false}
              - {label: "Text Englisch", name: "text_en", widget: "text", required: false}
              - {label: "Titel Französisch", name: "title_fr", widget: "string", required: false}
              - {label: "Text Französisch", name: "text_fr", widget: "text", required: false}
              - {label: "Titel Niederländisch", name: "title_nl", widget: "string", required: false}
              - {label: "Text Niederländisch", name: "text_nl", widget: "text", required: false}
              - {label: "Titel Russisch", name: "title_ru", widget: "string", required: false}
              - {label: "Text Russisch", name: "text_ru", widget: "text", required: false}
              - {label: "Foto", name: "image", widget: "image", required: false}
              - {label: "Anzeigen", name: "visible", widget: "boolean", default: true}
