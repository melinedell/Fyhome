        format: "json"
        fields:
          - {label: "Sprache (nicht ändern)", name: "lang", widget: "hidden", default: "en"}
          - {label: "Letzter Stand", name: "updated", widget: "string"}
          - label: "Impressum und Allgemeine Nutzungsbedingungen"
            name: "legal"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Überschrift", name: "title", widget: "string"}
              - {label: "Absatztext", name: "body", widget: "text"}
          - label: "Datenschutzerklärung"
            name: "privacy"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Überschrift", name: "title", widget: "string"}
              - {label: "Absatztext", name: "body", widget: "text"}
          - label: "Cookie-Richtlinie"
            name: "cookies"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Überschrift", name: "title", widget: "string"}
              - {label: "Absatztext", name: "body", widget: "text"}
      - label: "Français – Impressum, AGB, Datenschutz & Cookies"
        name: "legal_fr"
