# FYHOM GitHub OAuth runs on the same Cloudflare Pages origin as /admin/.
# Configure GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET as encrypted Pages variables.
backend:
  name: github
  repo: melinedell/Fyhome
  branch: main
  site_domain: fyhome-e0f.pages.dev
  base_url: https://fyhome-e0f.pages.dev
  auth_endpoint: api/auth

media_folder: "images/properties"
public_folder: "/images/properties"
publish: true
collections:
  - name: "rechtstexte"
    label: "Rechtstexte · Impressum / AGB / Datenschutz / Cookies"
    files:
      - label: "Deutsch – Impressum, AGB, Datenschutz & Cookies"
        name: "legal_de"
        file: "content/legal/de.json"
        format: "json"
        fields:
          - {label: "Sprache (nicht ändern)", name: "lang", widget: "hidden", default: "de"}
          - {label: "Letzter Stand", name: "updated", widget: "string"}
          - label: "Impressum und Allgemeine Nutzungsbedingungen"
            name: "legal"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Überschrift", name: "title", widget: "string"}
              - {label: "Absatztext", name: "body", widget: "text"}
          - label: "Datenschutzerklärung"
            name: "privacy"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Überschrift", name: "title", widget: "string"}
              - {label: "Absatztext", name: "body", widget: "text"}
          - label: "Cookie-Richtlinie"
            name: "cookies"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Überschrift", name: "title", widget: "string"}
              - {label: "Absatztext", name: "body", widget: "text"}
      - label: "Español – Impressum, AGB, Datenschutz & Cookies"
        name: "legal_es"
        file: "content/legal/es.json"
        format: "json"
        fields:
