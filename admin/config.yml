              - {label: "Überschrift", name: "title", widget: "string"}
              - {label: "Absatztext", name: "body", widget: "text"}
      - label: "Nederlands – Impressum, AGB, Datenschutz & Cookies"
        name: "legal_nl"
        file: "content/legal/nl.json"
        format: "json"
        fields:
          - {label: "Sprache (nicht ändern)", name: "lang", widget: "hidden", default: "nl"}
          - {label: "Letzter Stand", name: "updated", widget: "string"}
          - label: "Impressum und Allgemeine Nutzungsbedingungen"
            name: "legal"
            widget: "list"
