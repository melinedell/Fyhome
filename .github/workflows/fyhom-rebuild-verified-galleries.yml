name: FYHOM - Verify and Repair Every Property Photo Gallery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/fyhom-rebuild-verified-galleries.yml]
permissions:
  contents: write
concurrency:
  group: fyhom-verified-property-galleries
  cancel-in-progress: false
jobs:
  verify-galleries:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get FYHOM property catalogue
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and HTML tools
        run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "Pillow>=10,<13"
      - name: Rebuild from only each listing's original WordPress lightbox
        run: python -u scripts/rebuild_verified_fyhom_galleries.py
      - name: Ensure only property galleries and audit report are updated
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/properties.json content/verified-property-photos-review.json images/properties/verified/
          if git diff --cached --quiet; then
            echo "No gallery changes."
          else
            git commit -m "Replace mixed property galleries with verified originals for matching reference IDs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
