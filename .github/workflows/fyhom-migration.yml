name: FYHOM - Immobilien einmalig importieren
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fyhom-migration.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'Pillow>=10,<13'
      - name: Copy old property listings and photos into hidden drafts
        run: python scripts/import_old_fyhom.py
      - name: Save drafts and images on migration branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/properties.json content/import-review.json images/properties/imported
          if git diff --cached --quiet; then
            echo 'No new listings found.'
          else
            git commit -m 'Import FYHOM property drafts and self-hosted photographs'
            git push
          fi
