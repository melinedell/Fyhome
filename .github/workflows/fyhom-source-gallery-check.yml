name: FYHOM - Check Original Property Photo Galleries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/fyhom-source-gallery-check.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Inspect original listing galleries only
        run: python scripts/inspect_source_galleries.py
      - name: Save read-only diagnostic for gallery identification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/source-gallery-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "Record FYHOM original gallery diagnostic"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
